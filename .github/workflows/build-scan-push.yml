name: Build, scan and push

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/build-scan-push.yml"
  workflow_dispatch:

# Least privilege by default. Only the publish job adds id-token: write.
permissions:
  contents: read

concurrency:
  group: build-scan-push
  cancel-in-progress: false

env:
  IMAGE_NAME: cloud-native-app

jobs:
  build-and-scan:
    name: Test, build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compute immutable tag from the commit SHA
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests
        run: ./mvnw -B verify
      - name: Build image
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: docker build --pull -t "$IMAGE_NAME:$TAG" .
      - name: Save image as a tar file
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: docker save "$IMAGE_NAME:$TAG" -o image.tar
      # Fixable HIGH and CRITICAL findings fail the job, so the image is never
      # uploaded or pushed. Accepted exceptions go in .trivyignore with a reason
      # and an expiry date. Unfixed findings are reported but do not block.
      - name: Trivy image scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            aquasec/trivy@sha256:3d1f862cb6c4fe13c1506f96f816096030d8d5ccdb2380a3069f7bf07daa86aa \
            image --input /work/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --skip-version-check --exit-code 1
      - name: Upload the scanned image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanned-image
          path: image.tar
          retention-days: 1

  publish:
    name: Push scanned image to ECR
    needs: build-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      TAG: ${{ needs.build-and-scan.outputs.tag }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: 9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-image
      - name: Load the scanned image
        run: docker load -i image.tar
      - name: Authenticate to AWS with OIDC
        uses: e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "REGISTRY=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - name: Push (idempotent) and record the digest
        id: push
        run: |
          set -euo pipefail
          REPO_URI="${REGISTRY}/${ECR_REPOSITORY}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists (tags are immutable); reusing it."
          else
            docker tag "$IMAGE_NAME:$TAG" "$REPO_URI:$TAG"
            docker push "$REPO_URI:$TAG"
          fi
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected digest: $DIGEST"; exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Reference | \`${REPO_URI}@${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
